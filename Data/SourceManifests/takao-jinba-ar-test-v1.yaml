attribution: "出典：国土地理院ウェブサイト、八王子市公式資料"
processing_note: "AR候補算出と固定リプレイの現地検証用に、山名・座標・標高だけをYamaLens向けSQLiteへ加工する。"
verification_note: "高尾山と陣馬山は国土地理院『日本の主な山岳標高一覧』、景信山・堂所山・生藤山は地理院地図検索と八王子市等の公式資料を2026-08-23に照合した。正式対応地域としての施設・気象・交通情報は収録しない。"
distribution_note: "開発用ARテストパック専用。App Store配布物や正式対応地域の表示へ混在させない。"
