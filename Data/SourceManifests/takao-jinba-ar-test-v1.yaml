id: takao-jinba-ar-test-v1
title: YamaLens 高尾・陣馬ARテスト用山頂データ
status: development_test_only_provisional
checked_at: 2026-08-23
scope:
  - mountain_name
  - alias
  - summit_coordinate
  - elevation
sources:
  - provider: 国土地理院
    role: 主要山岳の座標・標高の一次情報
    url: https://www.gsi.go.jp/kihonjohochousa/kihonjohochousa41139.html
    map_url: https://maps.gsi.go.jp/
    terms_url: https://www.gsi.go.jp/kikakuchousei/kikakuchousei40182.html
  - provider: 八王子市
    role: 高尾・陣馬稜線の山名と標高の一次案内
