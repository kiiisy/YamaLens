    terms_checked_at: 2026-08-24
    robots_txt_check: "2026-08-24時点で提供元のrobots.txtは404。HTMLは巡回せず、公式CKAN APIだけを手動実行する。"
    fetch_method: "CKAN DataStore APIへ地方公共団体名と名称の完全一致filterを指定し、1件だけ取得"
    execution: manual
    minimum_interval_hours: 168
    parser_version: kanagawa-park-ckan-v1
    allowed_fields:
      - 地方公共団体名
      - 名称
      - 所在地
      - 無料駐車場
      - 有料駐車場
      - 開園時間
      - 休園日
      - 最終更新日
    canonical_point_of_interest_id: hadano-tokawa-okura-parking
    review_policy: "正規JSONを自動変更しない。候補差分、営業情報、出典更新日を人が公式情報と照合してから反映する。"
    anomaly_policy: "0件、複数件、filter不一致、型・日付不正、HTTP・URL・Content-Type・サイズ不正は失敗として候補を破棄し、既存値を維持する。"
attribution: "出典：国土地理院ウェブサイト"
processing_note: "国土地理院の情報を照合し、YamaLens向けSQLiteへ加工した場合は、その旨と対象データセットをアプリ内に表示する。"
legal_note: "基盤地図情報等の測量成果を配布物へ収録する前に、測量法上の複製・使用承認の要否をデータセットと利用形態ごとに確認する。"
verification_note: "丹沢中心6座の座標・標高は、国土地理院『日本の主な山岳標高一覧』および地理院地図検索で2026-08-22に照合した。周辺候補11座の名称、別名、座標、標高と配布許諾は正式配布前に一次情報で最終確認する。"
facility_verification_note: "丹沢中心6座（蛭ヶ岳、丹沢山、塔ノ岳、檜洞丸、鍋割山、大山）に紐づける代表施設20件を2026-08-24に運営者・自治体等の公式ページで一括レビューした。名称、用途、公式URL、短い案内、山・登山口との関係を確認し、変動する営業時間、料金、運行・営業状況には公式確認を促す。ヤビツ峠駐車場は神奈川県の管理施設一覧を直接根拠とし、24台無料、西丹沢ビジターセンター駐車場は10台無料として確認した。レビュー記録はData/FacilityReviews/tanzawa-existing-facilities-2026-08-24.jsonに保存する。"
